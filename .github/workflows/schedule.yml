name: Rain Alert

on:
  schedule:
    # GitHub cron is UTC. 14:00 UTC = 8:00am MDT (summer) / 7:00am MST (winter).
    - cron: "0 14 * * *"
  workflow_dispatch:

jobs:
  run-rain-alert:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run rain alert
        env:
          OWM_API_KEY: ${{ secrets.OWM_API_KEY }}
          TWILIO_ACCT_SID: ${{ secrets.TWILIO_ACCT_SID }}
          TWILIO_AUTH_TKN: ${{ secrets.TWILIO_AUTH_TKN }}
        run: python main.py
